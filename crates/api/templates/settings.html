<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1419; color:#e8eef5; max-width:640px; margin:2rem auto; padding:1rem; }
    a { color:#3b82f6; }
    label { display:block; margin-top:1rem; color:#8b9bb4; }
    input, textarea { width:100%; padding:0.5rem; border-radius:6px; border:1px solid #334155; background:#0b1018; color:#e8eef5; box-sizing:border-box; }
    button { margin-top:1rem; padding:0.5rem 1rem; background:#3b82f6; color:white; border:none; border-radius:6px; cursor:pointer; }
    .ok { color:#22c55e; }
  </style>
</head>
<body>
  <p><a href="/">← Queue</a></p>
  <h1>Restaurant settings</h1>
  {% if saved %}<p class="ok">Saved.</p>{% endif %}
  <form method="post" action="/settings">
    <input type="hidden" name="csrf" value="{{ csrf_token }}"/>
    <label>Restaurant name</label>
    <input type="text" name="restaurant_name" value="{{ restaurant_name }}" required/>
    <label>Cuisine style</label>
    <input type="text" name="cuisine_style" value="{{ cuisine_style }}" required/>
    <label>Context (policies, neighbourhood)</label>
    <textarea name="context_line" rows="4" required>{{ context_line }}</textarea>
    <label>Voice / tone (optional)</label>
    <input type="text" name="voice_tone" value="{{ voice_tone }}"/>
    <label>Signature dishes (comma-separated)</label>
    <input type="text" name="signature_dishes" value="{{ signature_dishes }}"/>
    <label>Opening hours (optional)</label>
    <input type="text" name="opening_hours_text" value="{{ opening_hours_text }}"/>
    <label>Notifier quiet hours note (optional)</label>
    <input type="text" name="notifier_quiet_hours" value="{{ notifier_quiet_hours }}"/>
    <button type="submit">Save</button>
  </form>
</body>
</html>
