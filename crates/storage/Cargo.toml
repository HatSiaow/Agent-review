[package]
name = "storage"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

sqlx = { version = "0.7", default-features = false, features = ["macros", "postgres", "runtime-tokio-rustls", "time", "uuid", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
